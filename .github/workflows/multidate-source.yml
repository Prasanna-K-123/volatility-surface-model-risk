name: Multidate source registration and metadata
on:
  push:
    branches: [research/multidate-shape-20261011]
    paths:
      - 'inspect_multidate_source.py'
      - 'collect_multidate_archive.py'
      - '.github/workflows/multidate-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public archive metadata without observations
        run: python inspect_multidate_source.py
      - name: Collect registered CC0 archive and inspect schema only
        run: |
          python -m pip install libarchive-c==5.3
          python collect_multidate_archive.py
      - name: Retain source-resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multidate-source-metadata
          path: results/multidate_source_metadata
          retention-days: 30
