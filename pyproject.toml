[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-volatility-research"
version = "0.1.0"
description = "Reproducible implied-volatility surface calibration and hedging-risk research"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
